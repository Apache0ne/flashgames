<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Flash Game</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <embed
    id="game"
    src="myfirstgame.swf"
    type="application/x-shockwave-flash">
</body>
</html>
